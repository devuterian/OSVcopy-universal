name: Import OSVcopy Universal snapshot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode | tar -xz
          mkdir -p Bundle
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/devuterian/OSVcopy/877d8fce81c27022d0def77901eb5b52fa48d87c/Bundle/OSVcopy.icns' \
            --output Bundle/OSVcopy.icns
          test "$(wc -c < Bundle/OSVcopy.icns)" -gt 100000
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-repository.yml
      - name: Commit imported repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'migration exception: import OSVcopy Universal snapshot'
          git push origin HEAD:main
