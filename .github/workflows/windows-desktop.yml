name: Windows desktop

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: osvcopy-universal-windows
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
